name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # prepack cleans, typechecks source/tests/examples, tests, and builds.
      - run: pnpm pack --pack-destination "$RUNNER_TEMP/effect-pi-pack"
      - run: bash scripts/smoke-examples
